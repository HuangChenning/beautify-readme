<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="600" viewBox="0 0 960 600"
     data-diagram-engine="editorial-static"
     data-readme-preset="doc-inline"
     role="img" aria-labelledby="readme-flow-title readme-flow-desc">
  <title id="readme-flow-title">Verified README production flow</title>
  <desc id="readme-flow-desc">Source-backed flow from a README request through repository inspection, production-path selection, static asset creation, and verification.</desc>

  <defs>
    <marker id="readme-flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#6e7681"/>
    </marker>
    <marker id="readme-flow-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="18" fill="#0d1117"/>
  <g opacity="0.045" stroke="#58a6ff" stroke-width="1">
    <path d="M0 60 H960 M0 120 H960 M0 180 H960 M0 240 H960 M0 300 H960 M0 360 H960 M0 420 H960 M0 480 H960 M0 540 H960"/>
    <path d="M60 0 V600 M180 0 V600 M300 0 V600 M420 0 V600 M540 0 V600 M660 0 V600 M780 0 V600 M900 0 V600"/>
  </g>

  <text x="56" y="54" fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="2">SOURCE-BACKED WORKFLOW</text>
  <text x="56" y="91" fill="#e6edf3"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="30" font-weight="700">From request to verified README asset</text>

  <!-- Connectors render before nodes. -->
  <g fill="none" stroke="#6e7681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
     marker-end="url(#readme-flow-arrow)">
    <path d="M240 174 H284"/>
    <path d="M450 174 H494"/>
    <path d="M660 174 H704"/>
    <path d="M790 218 V352"/>
    <path d="M704 394 H660"/>
    <path d="M494 394 H450"/>
  </g>
  <path d="M284 394 H240" fill="none" stroke="#58a6ff" stroke-width="3"
        stroke-linecap="round" marker-end="url(#readme-flow-arrow-accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="74" y="130" width="166" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="94" y="158" fill="#58a6ff" font-size="18" font-weight="700">01</text>
      <text x="94" y="184" fill="#e6edf3" font-size="22" font-weight="700">Request</text>
      <text x="94" y="207" fill="#8b949e" font-size="18">README or asset</text>
    </g>
    <g>
      <rect x="284" y="130" width="166" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="304" y="158" fill="#58a6ff" font-size="18" font-weight="700">02</text>
      <text x="304" y="184" fill="#e6edf3" font-size="22" font-weight="700">Set context</text>
      <text x="304" y="207" fill="#8b949e" font-size="18">GitHub or Viewer</text>
    </g>
    <g>
      <rect x="494" y="130" width="166" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="514" y="158" fill="#58a6ff" font-size="18" font-weight="700">03</text>
      <text x="514" y="184" fill="#e6edf3" font-size="22" font-weight="700">Inspect repo</text>
      <text x="514" y="207" fill="#8b949e" font-size="18">README / tree / proof</text>
    </g>
    <g>
      <rect x="704" y="130" width="172" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="724" y="158" fill="#58a6ff" font-size="18" font-weight="700">04</text>
      <text x="724" y="184" fill="#e6edf3" font-size="22" font-weight="700">Freeze system</text>
      <text x="724" y="207" fill="#8b949e" font-size="18">Story / palette / motif</text>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="704" y="352" width="172" height="84" rx="10" fill="#17263a" stroke="#58a6ff" stroke-width="2"/>
      <text x="724" y="380" fill="#58a6ff" font-size="18" font-weight="700">05</text>
      <text x="724" y="406" fill="#e6edf3" font-size="22" font-weight="700">Choose path</text>
      <text x="724" y="429" fill="#a5d6ff" font-size="18">3 production branches</text>
    </g>
    <g>
      <rect x="494" y="352" width="166" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="514" y="380" fill="#58a6ff" font-size="18" font-weight="700">06</text>
      <text x="514" y="406" fill="#e6edf3" font-size="22" font-weight="700">Build asset</text>
      <text x="514" y="429" fill="#8b949e" font-size="18">Source + static file</text>
    </g>
    <g>
      <rect x="284" y="352" width="166" height="84" rx="10" fill="#17263a" stroke="#58a6ff" stroke-width="2"/>
      <text x="304" y="380" fill="#58a6ff" font-size="18" font-weight="700">07</text>
      <text x="304" y="406" fill="#e6edf3" font-size="22" font-weight="700">Verify</text>
      <text x="304" y="429" fill="#a5d6ff" font-size="18">Audit / verify</text>
    </g>
    <g>
      <rect x="74" y="352" width="166" height="84" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="94" y="380" fill="#3fb950" font-size="18" font-weight="700">08</text>
      <text x="94" y="406" fill="#e6edf3" font-size="22" font-weight="700">Publish safely</text>
      <text x="94" y="429" fill="#8b949e" font-size="18">Diff first</text>
    </g>
  </g>

  <line x1="56" y1="493" x2="904" y2="493" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="527" fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18">Repository evidence</text>
  <text x="346" y="527" fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18">Frozen visual system</text>
  <text x="672" y="527" fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18">Verified static output</text>
</svg>
